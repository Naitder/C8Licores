<body>
    <header id="cabezera" class="cabezera">
    <a href="index.html" class="nombre">
        <span class="icono1"></span>
        <h1>C8LICORES</h1>
    </a>
    
    <!-- Icono hamburguesa (visible solo en móvil) -->
    <button class="menu-toggle" id="menu-toggle" aria-label="Abrir menú">
        <span class="hamburger"></span>
    </button>

    <!-- Contenedor de navegación que se oculta en móviles -->

        <a href="index_admin.html" class="panel-admin productos"><h2>PANEL</h2></a>

        <a href="#" id="btn-logout" class="salir private-nav hidden">
            <h2>SALIR</h2>
        </a>
    </nav>
    </header>
    <main class="carrito-page">
    <section class="carrito-items" id="carrito-items">
        <!-- Aquí se renderizan los productos -->
    </section>
    <aside class="carrito-resumen" id="carrito-resumen">
        <h2>Total del carrito</h2>
        <p id="carrito-total">$0</p>
        <p id="carrito-descuento" class="carrito-descuento" hidden></p>
        <p id="carrito-iva" class="carrito-iva"></p>
        <label>Dirección de entrega
            <input id="carrito-direccion" type="text" maxlength="200" autocomplete="street-address">
        </label>
        <label>Forma de pago
            <select id="carrito-pago">
                <option value="contra_entrega">Contra entrega</option>
                <option value="transferencia">Transferencia bancaria</option>
                <option value="manual">Pago manual</option>
            </select>
        </label>
        <p class="carrito-aviso-edad">Venta de licor: solo a mayores de 18 años.</p>
        <label>Fecha de nacimiento
            <input id="carrito-nacimiento" type="date" autocomplete="bday">
        </label>
        <label>Cédula
            <input id="carrito-cedula" type="text" maxlength="10" inputmode="numeric" autocomplete="off">
        </label>
        <label class="carrito-factura-opcion">
            <input id="carrito-factura" type="checkbox"> Quiero factura
        </label>
        <div id="carrito-factura-datos" class="oculto">
            <label>Nombre o razón social
                <input id="carrito-factura-nombre" type="text" maxlength="80" autocomplete="off">
            </label>
            <label>Cédula o NIT
                <input id="carrito-factura-id" type="text" maxlength="20" autocomplete="off" inputmode="numeric">
            </label>
        </div>
        <p id="carrito-aviso" class="carrito-aviso" role="status"></p>
        <button class="btn-comprar" disabled>Comprar</button>
    </aside>
</main>
    <footer>
        <span class="creditos">Cortes Kevyn, Escobar Cristiam, Gonzales Juan, Hincapie Cristian, Lopez Brayan</span>
    </footer>
